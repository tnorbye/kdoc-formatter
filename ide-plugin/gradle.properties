# IntelliJ Platform Artifacts Repositories
# -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = kdoc-formatter
# Display name on the JetBrains Marketplace; overrides <name> in plugin.xml, so keep them equal.
pluginName = Kotlin KDoc Formatter
pluginRepositoryUrl = https://github.com/tnorbye/kdoc-formatter

# See https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# for insight into build numbers and IntelliJ Platform versions.
pluginSinceBuild = 261
pluginUntilBuild = 271.*

# IntelliJ Platform Properties -> https://github.com/JetBrains/gradle-intellij-plugin#intellij-platform-properties
platformType = IU
platformVersion = 2026.3
# IDE versions `verifyPlugin` checks: the oldest (pluginSinceBuild) and newest supported.
pluginVerifierIdeVersions = 2026.1, 2026.3
#platformVersion = 253.28294.334

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
platformPlugins = org.jetbrains.kotlin,com.intellij.java,org.intellij.intelliLang

# Java language level used to compile sources and to generate the files for
javaVersion = 21

# Opt-out flag for bundling Kotlin standard library.
kotlin.stdlib.default.dependency=false
